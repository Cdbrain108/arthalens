<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>
  
  <!-- Outer target ring - blue -->
  <circle cx="32" cy="32" r="24" stroke="#4285F4" stroke-width="2.5" opacity="0.9"/>
  <!-- Middle target ring - red -->
  <circle cx="32" cy="32" r="16" stroke="#EA4335" stroke-width="2.5" opacity="0.9"/>
  <!-- Inner target ring - yellow -->
  <circle cx="32" cy="32" r="9" stroke="#FBBC05" stroke-width="2.5" opacity="0.9"/>
  <!-- Center dot - green -->
  <circle cx="32" cy="32" r="3.5" fill="#34A853"/>
  
  <!-- Crosshair lines (4 short segments) -->
  <!-- Top -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#4285F4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom -->
  <line x1="32" y1="50" x2="32" y2="60" stroke="#4285F4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Left -->
  <line x1="4" y1="32" x2="14" y2="32" stroke="#4285F4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Right -->
  <line x1="50" y1="32" x2="60" y2="32" stroke="#4285F4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Small tick marks between rings -->
  <line x1="32" y1="19" x2="32" y2="22" stroke="#EA4335" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="42" x2="32" y2="45" stroke="#EA4335" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="19" y1="32" x2="22" y2="32" stroke="#EA4335" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="32" x2="45" y2="32" stroke="#EA4335" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
