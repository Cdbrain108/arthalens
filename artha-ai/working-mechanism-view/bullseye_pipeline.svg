<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ab4f8"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78d9ec"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1700" fill="#131314"/>

  <text x="600" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#e3e3e3">Bulls Eye — Complete Research Pipeline</text>
  <text x="600" y="82" text-anchor="middle" font-size="14" fill="#9aa0a6">one question → brain agent (CoT) → only-needed specialists → validated evidence → cited PDF file</text>

  <!-- USER QUERY -->
  <rect x="340" y="105" width="520" height="56" rx="14" fill="#1e1f20" stroke="#8ab4f8" stroke-width="2"/>
  <text x="600" y="129" text-anchor="middle" font-size="16" font-weight="bold" fill="#8ab4f8">USER QUERY</text>
  <text x="600" y="150" text-anchor="middle" font-size="12" fill="#9aa0a6">plain words, e.g. “Should I hold TCS for 5 years?”</text>
  <line x1="600" y1="161" x2="600" y2="185" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- AGENT 0 -->
  <rect x="220" y="185" width="760" height="150" rx="14" fill="#1e1f20" stroke="#b39af5" stroke-width="2.5"/>
  <text x="600" y="212" text-anchor="middle" font-size="17" font-weight="bold" fill="#b39af5">AGENT 0 · QUERY UNDERSTANDING AGENT (the brain)</text>
  <text x="600" y="236" text-anchor="middle" font-size="12.5" fill="#e3e3e3">1. READ the query → 2. THINK step-by-step (Chain-of-Thought): which company? what intent? what horizon?</text>
  <text x="600" y="257" text-anchor="middle" font-size="12.5" fill="#e3e3e3">3. PLAN the smallest useful agent set → 4. ROUTE to relevant agents ONLY if needed</text>
  <text x="600" y="305" text-anchor="middle" font-size="12" fill="#9aa0a6">Tools: structured LLM (or deterministic mock) + routing-policy table · LangGraph: planner + StateGraph router</text>
  <line x1="600" y1="335" x2="600" y2="360" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="612" y="352" font-size="11" fill="#9aa0a6">plan + agent list</text>

  <!-- ROUTER -->
  <rect x="340" y="360" width="520" height="64" rx="14" fill="#17181b" stroke="#78d9ec" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="600" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#78d9ec">DYNAMIC ROUTER — “needed for THIS query?”</text>
  <text x="600" y="405" text-anchor="middle" font-size="12" fill="#9aa0a6">policy guardrail: minimums per intent · hard exclusions · max-agent cap</text>

  <!-- fan-out dashed lines -->
  <g stroke="#78d9ec" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="420" y1="424" x2="210" y2="470"/><line x1="510" y1="424" x2="600" y2="470"/><line x1="690" y1="424" x2="990" y2="470"/>
    <line x1="420" y1="424" x2="210" y2="660"/><line x1="600" y1="424" x2="600" y2="660"/><line x1="780" y1="424" x2="990" y2="660"/>
    <line x1="420" y1="424" x2="210" y2="850"/><line x1="600" y1="424" x2="600" y2="850"/><line x1="780" y1="424" x2="990" y2="850"/>
  </g>
  <text x="1055" y="450" font-size="11" fill="#78d9ec">only if needed</text>

  <!-- ROW 1 -->
  <g font-size="12">
    <rect x="30" y="470" width="360" height="170" rx="12" fill="#1e1f20" stroke="#81c995" stroke-width="1.8"/>
    <text x="210" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#81c995">1 · FINANCIAL</text>
    <text x="210" y="518" text-anchor="middle" fill="#e3e3e3">Revenue, profit, margins, EPS,</text>
    <text x="210" y="536" text-anchor="middle" fill="#e3e3e3">debt, ROE/ROCE + trends</text>
    <text x="210" y="562" text-anchor="middle" font-size="11" fill="#9aa0a6">get_financials · metrics ·</text>
    <text x="210" y="578" text-anchor="middle" font-size="11" fill="#9aa0a6">calculate_ratio · Finnhub · bfinance</text>
    <text x="210" y="604" text-anchor="middle" font-size="11" fill="#9aa0a6">min 4 evidence items</text>

    <rect x="420" y="470" width="360" height="170" rx="12" fill="#1e1f20" stroke="#81c995" stroke-width="1.8"/>
    <text x="600" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#81c995">2 · VALUATION</text>
    <text x="600" y="518" text-anchor="middle" fill="#e3e3e3">P/E, P/B, EV/EBITDA… via tools</text>
    <text x="600" y="536" text-anchor="middle" fill="#e3e3e3">only, vs peers + history</text>
    <text x="600" y="562" text-anchor="middle" font-size="11" fill="#9aa0a6">get_quote · metrics ·</text>
    <text x="600" y="578" text-anchor="middle" font-size="11" fill="#9aa0a6">calculate_ratio · Stooq fallback</text>
    <text x="600" y="604" text-anchor="middle" font-size="11" fill="#9aa0a6">min 5 evidence items</text>

    <rect x="810" y="470" width="360" height="170" rx="12" fill="#1e1f20" stroke="#8ab4f8" stroke-width="1.8"/>
    <text x="990" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#8ab4f8">3 · MARKET</text>
    <text x="990" y="518" text-anchor="middle" fill="#e3e3e3">Real price, volume, history</text>
    <text x="990" y="536" text-anchor="middle" fill="#e3e3e3">+ sector context, with dates</text>
    <text x="990" y="562" text-anchor="middle" font-size="11" fill="#9aa0a6">get_quote · price_history ·</text>
    <text x="990" y="578" text-anchor="middle" font-size="11" fill="#9aa0a6">get_volume · Stooq fallback</text>
    <text x="990" y="604" text-anchor="middle" font-size="11" fill="#9aa0a6">no invented indicators</text>
  </g>

  <!-- ROW 2 -->
  <g font-size="12">
    <rect x="30" y="660" width="360" height="170" rx="12" fill="#1e1f20" stroke="#fdd663" stroke-width="1.8"/>
    <text x="210" y="686" text-anchor="middle" font-size="15" font-weight="bold" fill="#fdd663">4 · NEWS</text>
    <text x="210" y="708" text-anchor="middle" fill="#e3e3e3">Dated event chronology:</text>
    <text x="210" y="726" text-anchor="middle" fill="#e3e3e3">earnings, deals, regulation</text>
    <text x="210" y="752" text-anchor="middle" font-size="11" fill="#9aa0a6">Google + Yahoo + Bing RSS ·</text>
    <text x="210" y="768" text-anchor="middle" font-size="11" fill="#9aa0a6">GDELT · Tavily-news · GNews</text>
    <text x="210" y="794" text-anchor="middle" font-size="11" fill="#9aa0a6">min 3 evidence items</text>

    <rect x="420" y="660" width="360" height="170" rx="12" fill="#1e1f20" stroke="#fdd663" stroke-width="1.8"/>
    <text x="600" y="686" text-anchor="middle" font-size="15" font-weight="bold" fill="#fdd663">5 · GROWTH</text>
    <text x="600" y="708" text-anchor="middle" fill="#e3e3e3">Capex, expansion, products;</text>
    <text x="600" y="726" text-anchor="middle" fill="#e3e3e3">tag announced→executing→done</text>
    <text x="600" y="752" text-anchor="middle" font-size="11" fill="#9aa0a6">Tavily keyless · Jina Search ·</text>
    <text x="600" y="768" text-anchor="middle" font-size="11" fill="#9aa0a6">DDG · Serper · Exa</text>
    <text x="600" y="794" text-anchor="middle" font-size="11" fill="#9aa0a6">never blur announced/delivered</text>

    <rect x="810" y="660" width="360" height="170" rx="12" fill="#1e1f20" stroke="#f28b82" stroke-width="1.8"/>
    <text x="990" y="686" text-anchor="middle" font-size="15" font-weight="bold" fill="#f28b82">6 · RISK</text>
    <text x="990" y="708" text-anchor="middle" fill="#e3e3e3">Hunt every risk; MUST find</text>
    <text x="990" y="726" text-anchor="middle" fill="#e3e3e3">1 thesis-breaking angle</text>
    <text x="990" y="752" text-anchor="middle" font-size="11" fill="#9aa0a6">web stack + news + docs</text>
    <text x="990" y="768" text-anchor="middle" font-size="11" fill="#9aa0a6">(Tavily · Jina · RSS · RAG)</text>
    <text x="990" y="794" text-anchor="middle" font-size="11" fill="#9aa0a6">no soft-pedaling</text>
  </g>

  <!-- ROW 3 -->
  <g font-size="12">
    <rect x="30" y="850" width="360" height="170" rx="12" fill="#1e1f20" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="210" y="876" text-anchor="middle" font-size="15" font-weight="bold" fill="#9aa0a6">7 · WORKFORCE *</text>
    <text x="210" y="898" text-anchor="middle" fill="#e3e3e3">Hiring signals from career</text>
    <text x="210" y="916" text-anchor="middle" fill="#e3e3e3">pages + disclosures only</text>
    <text x="210" y="942" text-anchor="middle" font-size="11" fill="#9aa0a6">Jina Search · Jina Reader fetch</text>
    <text x="210" y="968" text-anchor="middle" font-size="11" fill="#9aa0a6">LinkedIn scraping banned</text>

    <rect x="420" y="850" width="360" height="170" rx="12" fill="#1e1f20" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="600" y="876" text-anchor="middle" font-size="15" font-weight="bold" fill="#9aa0a6">8 · SOCIAL *</text>
    <text x="600" y="898" text-anchor="middle" fill="#e3e3e3">Discussion themes + strength</text>
    <text x="600" y="916" text-anchor="middle" fill="#e3e3e3">of evidence, qualitative only</text>
    <text x="600" y="942" text-anchor="middle" font-size="11" fill="#9aa0a6">Jina Search · DDG · Serper</text>
    <text x="600" y="968" text-anchor="middle" font-size="11" fill="#9aa0a6">never fake sentiment %</text>

    <rect x="810" y="850" width="360" height="170" rx="12" fill="#1e1f20" stroke="#b39af5" stroke-width="1.8"/>
    <text x="990" y="876" text-anchor="middle" font-size="15" font-weight="bold" fill="#b39af5">9 · DOCUMENT / RAG</text>
    <text x="990" y="898" text-anchor="middle" fill="#e3e3e3">Answers ONLY from filings;</text>
    <text x="990" y="916" text-anchor="middle" fill="#e3e3e3">page + section cites</text>
    <text x="990" y="942" text-anchor="middle" font-size="11" fill="#9aa0a6">FAISS + local embeddings ·</text>
    <text x="990" y="968" text-anchor="middle" font-size="11" fill="#9aa0a6">trafilatura chunks · Firecrawl</text>
  </g>
  <text x="600" y="1038" text-anchor="middle" font-size="11" fill="#9aa0a6">* optional — routed only when the question needs them · all 9 run IN PARALLEL (LangGraph async fan-out)</text>

  <!-- join lines to pool -->
  <g stroke="#8ab4f8" stroke-width="1.5">
    <line x1="210" y1="1020" x2="600" y2="1062"/><line x1="600" y1="1020" x2="600" y2="1062"/><line x1="990" y1="1020" x2="600" y2="1062"/>
  </g>

  <!-- EVIDENCE POOL -->
  <rect x="340" y="1062" width="520" height="52" rx="12" fill="#17181b" stroke="#8ab4f8" stroke-width="2"/>
  <text x="600" y="1084" text-anchor="middle" font-size="14" font-weight="bold" fill="#e3e3e3">EVIDENCE POOL — every claim carries source + excerpt</text>
  <text x="600" y="1103" text-anchor="middle" font-size="11" fill="#9aa0a6">one agent failing never stops the run — it becomes a labelled gap</text>
  <line x1="600" y1="1114" x2="600" y2="1138" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- VALIDATOR -->
  <rect x="340" y="1138" width="520" height="64" rx="12" fill="#1e1f20" stroke="#78d9ec" stroke-width="2"/>
  <text x="600" y="1162" text-anchor="middle" font-size="15" font-weight="bold" fill="#78d9ec">EVIDENCE VALIDATOR</text>
  <text x="600" y="1183" text-anchor="middle" font-size="12" fill="#9aa0a6">source exists · date known · units match · cross-source conflicts flagged · Jina Grounding spot-checks</text>
  <line x1="600" y1="1202" x2="600" y2="1226" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CHALLENGER -->
  <rect x="340" y="1226" width="520" height="64" rx="12" fill="#1e1f20" stroke="#f28b82" stroke-width="2"/>
  <text x="600" y="1250" text-anchor="middle" font-size="15" font-weight="bold" fill="#f28b82">BULL / BEAR CHALLENGER</text>
  <text x="600" y="1271" text-anchor="middle" font-size="12" fill="#9aa0a6">≥2 bull + ≥2 bear + triggers — every point traced to evidence, no new facts</text>
  <line x1="600" y1="1290" x2="600" y2="1314" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SYNTHESIZER -->
  <rect x="340" y="1314" width="520" height="64" rx="12" fill="#1e1f20" stroke="#b39af5" stroke-width="2"/>
  <text x="600" y="1338" text-anchor="middle" font-size="15" font-weight="bold" fill="#b39af5">SYNTHESIZER — combines + rewrites everything</text>
  <text x="600" y="1359" text-anchor="middle" font-size="12" fill="#9aa0a6">merges all findings · separates fact / interpretation / conclusion · gaps stay visible</text>
  <line x1="600" y1="1378" x2="600" y2="1402" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- REPORT + OUTPUT -->
  <rect x="340" y="1402" width="520" height="60" rx="12" fill="#1e1f20" stroke="#81c995" stroke-width="2"/>
  <text x="600" y="1425" text-anchor="middle" font-size="15" font-weight="bold" fill="#81c995">REPORT BUILDER + PDF ENGINE</text>
  <text x="600" y="1446" text-anchor="middle" font-size="12" fill="#9aa0a6">ReportJSON → Jinja2 template → PDF (deterministic — no LLM here)</text>
  <line x1="600" y1="1462" x2="600" y2="1486" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="340" y="1486" width="520" height="60" rx="12" fill="#1e1f20" stroke="#81c995" stroke-width="2.5"/>
  <text x="600" y="1510" text-anchor="middle" font-size="16" font-weight="bold" fill="#81c995">OUTPUT FILE — cited PDF report</text>
  <text x="600" y="1530" text-anchor="middle" font-size="12" fill="#9aa0a6">summary · ratios · bull/bear · risks · sources · timestamps — ready to download</text>

  <!-- LEGEND -->
  <g font-size="12" fill="#9aa0a6">
    <line x1="220" y1="1585" x2="270" y2="1585" stroke="#8ab4f8" stroke-width="2" marker-end="url(#arr)"/>
    <text x="278" y="1589">data flow (always)</text>
    <line x1="470" y1="1585" x2="520" y2="1585" stroke="#78d9ec" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
    <text x="528" y="1589">conditional (only-if-needed agents)</text>
    <text x="820" y="1589">dashed card = optional agent</text>
  </g>
  <text x="600" y="1625" text-anchor="middle" font-size="11" fill="#9aa0a6">₹0 mock mode: same stages run deterministically · add a Gemini/OpenRouter key → live LangGraph execution takes over</text>
  <text x="600" y="1655" text-anchor="middle" font-size="11" fill="#9aa0a6">LangGraph mapping: state = ResearchState · router = conditional edge + policy · specialists = concurrent fan-out · join = collect_results · report = synthesis + PDF</text>
</svg>
